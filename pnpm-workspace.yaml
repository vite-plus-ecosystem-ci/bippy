nodeLinker: hoisted

packages:
  - "packages/*"
  - "packages/conformance/fixtures/*"
  - "packages/e2e/fixtures/*"
overrides:
  react: ^19.2.4
  react-dom: ^19.2.4
  vite@*: "catalog:"
  vitest@*: "catalog:"
patchedDependencies:
  react-devtools-core@7.0.1: patches/react-devtools-core@7.0.1.patch
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.0.0-commit.6d65e1780791e2b24b27cf7deb63f57a420e78de
  vitest: 4.1.11
  vite-plus: 0.0.0-commit.6d65e1780791e2b24b27cf7deb63f57a420e78de
  "@vitest/coverage-istanbul": 4.1.11
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
