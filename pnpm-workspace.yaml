  - "packages/conformance/fixtures/*"
  - "packages/e2e/fixtures/*"
overrides:
  react: ^19.3.0
  react-dom: ^19.3.0
  vite@*: "catalog:"
  vitest@*: "catalog:"
patchedDependencies:
