name: Publish Any Commit

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: pkg-pr-new-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Ecosystem-ci smoke test: publishing a preview package needs a GitHub App or
      # token the fork does not have, and it does not exercise the pinned Vite+.
      - name: Publish
        if: ${{ github.repository_owner != 'vite-plus-ecosystem-ci' }}
        run: pnpx pkg-pr-new publish --compact ./packages/bippy
